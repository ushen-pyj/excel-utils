[package]
name = "excel-utils"
version = "0.1.0"
description = "Excel toolbox built with Tauri 2"
authors = ["Codex"]
edition = "2021"

[lib]
name = "excel_utils_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = "0.33"
csv = "1.4"
rust_xlsxwriter = "0.90.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
